name: Growth staging source checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - name: Staging credential isolation cases
        run: node --test verification/staging-environment.test.cjs
      - name: Source permission payment and experiment cases
        run: node --test --test-concurrency=1 verification/meta-pixel.test.cjs verification/marketing-integration.test.cjs verification/sales-checkout.test.cjs verification/stripe-fulfillment.test.cjs verification/purchase-intent.test.cjs verification/analytics-access.test.cjs verification/stripe-sandbox-boundary.test.cjs verification/growth-staging-entitlement.test.cjs verification/auth-callback-lifecycle.test.cjs verification/growth-staging-workbench.test.cjs
      - run: node node_modules/next/dist/bin/next typegen
      - run: node node_modules/typescript/bin/tsc --noEmit --incremental false
      - name: Scoped lint
        run: node node_modules/eslint/bin/eslint.js next.config.ts src/lib/analyticsAccess.ts src/lib/metaPixel.ts src/lib/stripePayments.ts src/lib/growthStaging.ts src/app/analytics/page.tsx src/app/api/analytics/access/route.ts src/app/api/payment/stripe/checkout/route.ts src/app/api/growth-staging/user/balance/route.ts src/app/api/growth-staging/workbench/route.ts src/app/auth/callback/page.tsx src/app/growth-staging/page.tsx
